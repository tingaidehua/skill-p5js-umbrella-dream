# 创作轨迹 · 接住星星的伞（p5.js 生成艺术）

> 这是一份可交给任何智能体（豆包、WorkBuddy、Claude、DeepSeek……）继续接力的完整轨迹：
> 每一步都记录了「用户说了什么 → 智能体怎么想 → 做了什么 → 看到了什么 → 交付了什么」。
> 接手时请先读「当前状态」和「已知问题与下一步」，再按需回看具体步骤。

## 当前状态（v7）

- 作品：竖幅 3:4，69 秒。一把线框伞被斜向上的阵风掀翻，伞骨全部指向天空，在风里发抖、挣扎；
  星星落进伞里、沿伞线停留，再被风一颗颗吹走，拖着尾巴飞向右上方；伞骨尖上挂着月牙、铃铛、星星、水滴、小鱼五个挂件，被风托起来乱舞。
- 声音：原创配乐，D 小调，72 BPM，偏悲伤。0–3.2 秒前奏（低处嗡鸣 + 由暗到亮的气息 + 零星闪光音），3.2 秒落拍时伞被掀翻；
  之后是 Dm(add9) – B♭maj7 – Gm9 – A7sus4 循环，八音盒八分音符、带颤音的叹息式主旋律、低音弦、很轻的“心跳”底鼓；结尾一串往下落的音。
- 交付物：网页（字幕 / 旁白 / 声音 / 复制轨迹 / 下载视频）、无字幕成片、字幕版成片、配乐 mp3、本轨迹、skill-p5js 压缩包。

## 关键参数（想调效果先动这些）

| 位置 | 参数 | 作用 |
|---|---|---|
| 顶部常量 | `NR=10, K=8` | 伞骨数量、每根伞骨分段 |
| 顶部常量 | `BPM=72, DROP=3.2, DUR=69` | 节拍、落拍时刻、总时长（画面与音乐共用） |
| `state()` | `o` 0.85→1.65s 撑开；`v` 2.25→3.45s 翻转 | 开场三幕的时间点 |
| `buildMesh()` | `ia = 2.12 + …`、`ib = ia + 0.40 + …`、`clamp(ia,1.95,2.9)` | 翻转后伞骨的角度（越接近 π 越竖直向上）；clamp 保证永不放平 |
| `effort()` | 周期 `BAR*2` | 伞“想合拢”的挣扎节奏 |
| `windAngle()` | `-1.18 ± 0.30` | 风向在偏上/偏右之间摆动的范围 |
| `gustAt()` | `0.35 + 1.25 * noise^1.7` | 阵风强弱带，顺风推进 |
| `field()` | `base 0.19U`、`swirl 0.24U`、尺度 `0.26U` | 基础风速、涡旋强度与尺度 |
| `update()` | `lRate = 14 + 48*…` | 伞线上冒星的速率（太密就调小） |
| `liftOff()` | `sp 0.03–0.09U`、`drag 0.9–1.8` | 被吹走时的初速与“跟风”程度 |
| `makeCanvas()` | `air` 190 颗 | 空中漂浮星星数量 |
| `Score` | `CHORDS`、`MELODY`、`MELODY2` | 和弦、主旋律（可整段替换风格） |

## 步骤

### Step 1 · 用户
> 帮我复现这个数字艺术视频，用的 p5js 框架做的，你要深刻理解视频作者的心思，然后再转换为艺术，再转换为程序。（附 13 秒竖屏视频）

**思考**：先“看懂”再动手。需要知道构图、时间结构、色彩、线条质感、粒子形状。
**动作**：ffprobe 读规格（1440×1920，30fps，13.3s）；每秒抽一帧拼成联系表；开场 0.4s 起 4fps 细看撑开过程；第 8 秒局部放大看粒子细节；对背景逐行取色。
**观察**：三幕——合拢的伞翻滚 → 撑开（线框锥形） → 被风吹翻成碗；之后星形/十字/圆圈粒子越来越多，顶点有横向镜头光斑；背景深蓝 rgb(20,30,232) 到天蓝 rgb(58,126,253)。
**理解**：伞本来挡雨，被吹翻后成了一只碗——“坏掉”变成“盛满”。
**实现**：2D canvas + 手写 3D 投影（spin/pitch/lean + 透视），伞骨按角度区间插值（合拢→撑开→翻转），加法混合发光，光斑用预渲染精灵。
**验证**：CDN 在沙箱里不可达 → 写了一个只用于截图测试的 p5 最小替身（random/noise/createCanvas 等），用无头 Chromium 按时间快进截图对照。
**结果**：v1 发布。

### Step 2 · 用户
> 伞的骨架应该有一种人格化，似乎在风中努力挣扎，星星下落，大风向上……骨架吹向斜上不断挣扎，伞上的小挂件被吹上舞动。你可以发挥想象，让整个场景更加诗意化，单独生成不一样的配音，要有感染力，想象你在梦中。

**思考**：人格化 = 有“意志”的周期性动作：想合拢（effort）→ 被风更狠地掀回（slam）。挂件需要真实的绳子物理。
**动作**：引入 `windAt / effort` 情绪曲线；伞骨依次“攥紧”（相位差 0.07s），沿伞骨传波；verlet 绳链挂件；梦呓字幕九句；Web Audio 生成配乐（和弦垫、八音盒、风声、挣扎低音、接星玻璃铃）；离线渲染整片 mp4（逐帧截图 + OfflineAudioContext 混音 + ffmpeg）。
**结果**：v2。问题：挣扎时伞面被压平；伞柄丝带过长；混音偏轻（−29.8 dB，经 loudnorm 修正）。

### Step 3 · 用户
> 声音换下，不用下雨风声，换点类似原视频的……伞骨架细一些，风是斜上的，伞骨架应该不会变平，应该全部吹向上表现了风大，伞柄底部那个布不用了。总之应该尽量还原原视频，可能还有一些细节没有想到。

**思考**：回到原片做更细的取证。
**动作**：
1. 对原片音频做频谱：0–3s 宽带上扬噪声 → 约 3s 落拍 → 中频拨弦琶音、低频和弦与底鼓。按同类风格**原创**一首（不照搬旋律）。
2. 截取第 6 秒相邻两帧局部对比 → **关键发现**：粒子的尾巴在下、星形在上，说明星星是从伞线上被风**向上吹走**的，而不是从天上落下。此前理解错了。
**实现**：粒子生命周期改为「在伞线上生成/落入 → 停留并滑向伞心 → 被风吹离，带历史轨迹尾巴」；伞骨角度 clamp 保证始终向上；线宽减到约 1.15px；去掉丝带、暗角、风丝；背景严格按原片取色。
**验证**：频谱发现低频过重，压低底鼓与低音、提高琶音后重渲。
**结果**：v3，提供无字幕版（贴近原片）与字幕版。

### Step 4 · 用户
> 空中散布的星星再多点，伞往上吹的东西太密太快了，风也不是完全直线斜上猛吹，应该更像真实的大风。

**实现**：
- 新增 `air`：190 颗远景星（四角星/十字/圆圈/点），按深度随风慢漂并闪烁。
- 风场 `field(x,y,t)`：风向缓慢摆动 + 顺风推进的阵风带 + 卷曲噪声（curl noise）涡旋；粒子用阻力追随当地风速（不再无限加速）。
- 冒星速率 210 → 48，停留 0.8–5.5s，初速 0.03–0.09U。
- 伞的晃动、挂件、落星都用同一风场，保证“同一股风”。
**结果**：v4。

### Step 5 · 用户
> 好像没听到声音，已经开了

**排查**：成片音轨正常（−17 dB）。网页用实时 Web Audio：iPhone 静音键会静音 Web Audio，部分内嵌页面也起不来。
**修复**：配乐作为 `score.mp3` 随页面发布，用 `<audio>` 播放（和视频同一通道）；加载失败才回退到页面内离线合成。画面时间由 `player.currentTime` 驱动，字幕与音乐对齐。
**结果**：v5。

### Step 6 · 用户
> 配音再悲伤一点；给一个 skill-p5js- 开头的 zip；网页再增加两个按钮：复制轨迹、下载视频（用于小红书、抖音）；复制轨迹类似 DeepSeek harness 的轨迹功能，从而优化调整，吸收不同智能体的优点，这也反映了制作的完整工作流。

**实现**：
- 配乐改为 D 小调、72 BPM：慢起的和弦垫、八音盒八分音符、带颤音的叹息式主旋律（第二轮落在更低处）、低音弦、仅一两下的“心跳”底鼓，混响加长；画面的挣扎周期与“心跳”光斑同步新节拍。
- 网页按钮：`复制轨迹`（剪贴板 → execCommand → 手动复制面板三级回退）、`下载视频`（随当前字幕开关选择版本；claude.ai 内用 downloads 能力，其他环境用 `<a download>`）。
- 成片按 1080×1440、两遍编码压到 15MB 以内，便于网页内下载与社媒上传。
- 打包 `skill-p5js-umbrella-dream.zip`：SKILL.md（工作流）、模板网页、渲染脚本、参数说明、本轨迹。
**结果**：v6/v7。

## 已知问题与下一步（欢迎其他智能体接力）

1. 成片由测试替身渲染；真实 p5.js 下 `noise()` 实现不同，画面细节会略有差异（构图与节奏一致）。可在本地装好 p5 后用 `scripts/render_frames.js` 重渲。
2. 旁白目前依赖设备自带 TTS。若有高质量中文语音合成，可按 `LINES` 的时间点生成并混入配乐。
3. 原片只有 13 秒；本作扩展到 69 秒。若要 15 秒短版用于抖音开头，可只渲染 0–15s 并在第 13 秒做淡出。
4. 风场参数仍可调：`swirl` 大 → 更乱更像暴风；`base` 大 → 更猛更直。
5. 可尝试：伞面加极淡的半透明填充；挂件碰撞时触发音效；让观众用鼠标/陀螺仪改变风向。

## 制作流水线（可复用）

1. 取证：`ffprobe` 规格 → 每秒抽帧拼联系表 → 关键段高帧率细看 → **相邻帧局部对比判断运动方向** → 背景逐行取色 → 音频频谱判断结构与风格。
2. 意图：用一句话说出作者的“心思”，再决定视觉语言（线、光、粒子、节奏）。
3. 程序：时间线函数（撑开/翻转/镜头）→ 3D 线框 → 粒子生命周期 → 风场 → 挂件物理 → 光斑 → 字幕。
4. 声音：Web Audio 写成可离线渲染的乐谱类；网页播放预渲染文件。
5. 渲染：无头 Chromium 固定步长逐帧截图（30fps）+ OfflineAudioContext 导出 WAV → `loudnorm` → ffmpeg 合成 H.264/AAC。
6. 验证：联系表抽查画面、`volumedetect` 与频谱检查声音、点击测试网页播放。
7. 交付：网页 + 无字幕/字幕两版 MP4 + 配乐 + 轨迹 + skill 包。

<script>
/* ==========================================================================
   接住星星的伞
   一把被斜向上的风吹翻的伞。它的骨头全被掀向天空，在风里发抖、挣扎，
   却始终不肯折断。星星落进它翻过来的怀里，在伞线上停一会儿，
   又被风一颗颗吹走，拖着细长的尾巴飞向右上方。
   p5.js · 手写 3D 投影 · verlet 挂件 · Web Audio 原创配乐
   ========================================================================== */

const NR = 10, K = 8, SHAFT = 1.75, MAX_SIT = 750;
const DUR = 69;
const BPM = 72, BEAT = 60 / BPM, BAR = BEAT * 4, DROP = 3.2;   // 第 3.2 秒落拍：伞刚好被风掀翻
const WIND_DIR = (() => { const x = 0.38, y = -1, l = Math.hypot(x, y); return [x / l, y / l]; })();
const FONT = '"Noto Serif SC","Noto Serif CJK SC","Noto Serif CJK TC","Songti SC",serif';
const RENDER_CAPS = !/nocap/.test(location.search);

const LINES = [
  [4.0, 9.6,  '我梦见一把伞，\n在没有雨的夜里撑开。'],
  [10.5, 16.2, '风从地面升起，\n要把它吹回天上。'],
  [17.0, 23.6, '它的骨头全被掀向天空，\n抖着，却一根也没有折断。'],
  [24.5, 31.6, '星星落进它翻过来的怀里，\n停一会儿，又被风接走。'],
  [32.5, 39.6, '挂在它身上的小东西被风托起，\n像一群不肯睡的孩子在跳舞。'],
  [40.5, 47.0, '原来坏掉的地方，\n正好能盛住光。'],
  [48.0, 55.0, '盛不下的那些，\n就让风送它们回家。'],
  [56.5, 61.2, '如果有一天，你也被风吹翻了——'],
  [61.8, 67.2, '别怕。\n抬起头，接住它们。'],
];

let W, H, U, PX;
let bgG, glowS, flareS;
let T = 0, started = false, M = null, spawnAcc = 0, lineAcc = 0;
let rain = [], sit = [], fly = [], bursts = [], dust = [], air = [], charms = [], ribJ = [];
let player = null, audioState = 'idle', soundOn = true, narrOn = false, capOn = RENDER_CAPS, spoken = new Set();

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerpF = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOutBack = (t, s = 1.7) => { t = clamp(t, 0, 1); const c = s + 1; return 1 + c * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const phase = (a, b, x) => clamp((x - a) / (b - a), 0, 1);

/* ---------------- 乐曲结构（画面与声音共用） ---------------- */
// 小节编号 b 从 DROP 开始；返回该小节的编配
function section(b) {
  if (b < 0) return 'intro';
  if (b < 4) return 'a';        // 和弦 + 八音盒
  if (b < 9) return 'b';        // + 主旋律 + 很轻的心跳
  if (b < 14) return 'c';       // 主旋律高八度 + 低音弦
  if (b < 17) return 'd';       // 抽空，只剩和弦与回声
  if (b < 19) return 'c';       // 最后一次
  return 'end';
}
const kickBeats = s => s === 'b' ? [0] : s === 'c' ? [0, 2] : [];
function kickPulse(t) {                              // 最近一次“心跳”的余韵，让伞心随之呼吸
  const tb = t - DROP; if (tb < 0) return 0;
  const b = Math.floor(tb / BAR), ks = kickBeats(section(b)); if (!ks.length) return 0;
  const inBar = tb - b * BAR; let last = -1;
  for (const k of ks) if (k * BEAT <= inBar) last = k * BEAT;
  return last < 0 ? 0 : Math.exp(-(inBar - last) * 5);
}

/* ---------------- 风与挣扎 ---------------- */
function windProfile(t) {
  const arrive = sstep(1.6, 3.2, t);
  const arc = 0.9 + 0.45 * sstep(16, 26, t) - 0.3 * sstep(48, 51, t) + 0.3 * sstep(58.5, 60.5, t) - 0.5 * sstep(63, DUR, t);
  return arrive * arc;
}
function effort(t) {                                  // 伞想收拢的那股劲：每两小节一次
  const inten = sstep(5, 12, t) * (1 - 0.8 * sstep(58, 64, t));
  const c = 0.5 - 0.5 * Math.cos(TAU * (t - DROP) / (BAR * 2));
  return inten * Math.pow(c, 3);
}
// 风向：在“偏上”和“偏右”之间缓慢摆动（屏幕坐标，-π/2 为正上方）
function windAngle(t) { return -1.18 + 0.30 * (noise(t * 0.11, 50) - 0.5) * 2 + 0.10 * Math.sin(t * 0.33); }
// 阵风：一团一团顺着风向推进的强弱带
function gustAt(x, y, t) {
  const a = windAngle(t), ux = Math.cos(a), uy = Math.sin(a);
  const along = (x * ux + y * uy) / U, across = (-x * uy + y * ux) / U;
  return 0.35 + 1.25 * Math.pow(noise(along * 1.4 - t * 0.5, across * 0.9 + 17), 1.7);
}

/* ---------------- 伞的姿态 ---------------- */
function state(t) {

  const shake = v * (0.008 + 0.022 * wind) * Math.sin(t * 13.0) * Math.sin(t * 2.1 + 1);
  const lean = -0.45 + 1.25 * tumble + v * (-0.12 * (wind - 0.9) + 0.08 * E + 0.05 * Math.sin(t * 0.55) + 0.08 * (noise(t * 0.6, 9) - 0.5) * wind) + shake;
  const spin = 0.9 + t * 0.2 + 0.9 * (noise(t * 0.18, 3) - 0.5) + 0.6 * tumble + 0.1 * E;
  const pitch = lerpF(0.18, 0.46, sstep(1.2, 3.8, t)) + 0.06 * Math.sin(t * 0.43 + 1) - 0.05 * E * v;
  const sc = lerpF(0.165, 0.265, k) * U;
  const ax = W / 2 + U * lerpF(-0.03, 0.035, k) + U * 0.01 * v * Math.sin(t * 0.37) + U * 0.01 * v * (wind - 0.9);
  const ay = H / 2 + U * lerpF(-0.03, -0.085, k) + U * 0.007 * v * Math.sin(t * 0.51 + 2) - U * 0.022 * v * (wind - 0.9) + U * 0.01 * E * v;
  return { o, v, wind, E, lean, spin, pitch, sc, ax, ay };
}

    const fl = noise(j.n, t * 0.6) - 0.5;

}

/* ---------------- 星：落下 → 停在伞线上 → 被风吹走 ---------------- */
const SHAPES = ['spark', 'spark', 'spark', 'plus', 'plus', 'x', 'ring', 'ring', 'ring', 'dot', 'dot', 'star'];

}
function segDist(px, py, a, b) {

  const t = clamp(((px - a[0]) * dx + (py - a[1]) * dy) / L2, 0, 1);

function update(dt) {

  // 2) 伞线上自己“长”出星光（越往后越密，伞心最密）
  const lRate = S.v * (14 + 48 * sstep(3.2, 16, T)) * (0.85 + 0.3 * noise(T * 0.4, 31)) * (1 - 0.5 * sstep(61, 67, T));
  lineAcc += lRate * dt;
  while (lineAcc >= 1 && sit.length < MAX_SIT) {
    lineAcc--;
    let seg;
    if (random() < 0.45) { const i = Math.floor(random(NR)); seg = i * K + Math.floor(K * Math.pow(random(), 1.8)); }   // 偏向伞心
    else seg = M.catchable[Math.floor(random(M.catchable.length))];
    sitOn(seg, random(), newGlyph(), random(0.8, 5.5) / (0.6 + 0.5 * wn));
  }
  if (lineAcc > 5) lineAcc = 5;
  // 3) 停留的星：沿伞骨往伞心滑，时间到了就被风吹走
  for (let n = sit.length - 1; n >= 0; n--) {
    const c = sit[n];
    if (c.rib !== undefined && c.s > c.target) c.s = Math.max(c.target, c.s - c.slide * dt * S.v);
    c.rot += c.spin * dt * 0.3;

  // 4) 飞走的星：斜向上，带着弯曲的尾巴
  for (let n = fly.length - 1; n >= 0; n--) {
    const f = fly[n];
    f.age += dt;
    // 跟着风场走：阻力让它逐渐追上当地的风速，阵风来时被推远，风歇时打旋、飘停
    const F = field(f.x, f.y, T);
    f.vx += (F[0] * f.w - f.vx) * f.drag * dt; f.vy += (F[1] * f.w - f.vy) * f.drag * dt;
    f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.spin * dt;
    f.hT += dt;
    if (f.hT > 0.045) { f.hT = 0; f.hist.push([f.x, f.y]); if (f.hist.length > f.tl) f.hist.shift(); }
    if (f.y < -0.1 * U || f.x > W + 0.1 * U || f.x < -0.2 * U || f.y > H + 0.1 * U) fly.splice(n, 1);

  for (const s of air) {
    const F = field(s.x, s.y, T);
    s.x += F[0] * s.depth * 0.35 * dt; s.y += (F[1] * s.depth * 0.35 + 0.006 * U) * dt; s.rot += s.spin * dt;
    if (s.y < -10) { s.y = H + 8; s.x = random(-0.2, 1) * W; } if (s.y > H + 10) s.y = -8;
    if (s.x > W + 10) { s.x = -8; s.y = random(H); } if (s.x < -12) s.x = W + 8;
  }
  for (const d of dust) {
    d.y -= (2 + 12 * wn * d.r) * PX * 3 * dt; d.x += 5 * wn * d.r * PX * 3 * dt;
    if (d.y < -4) { d.y = H + 4; d.x = random(W); } if (d.x > W + 4) d.x = -4;
  }
  updateCharms(dt, wn);
}

/* ---------------- 挂件 ---------------- */
function updateCharms(dt, wn) {
  const g = 1.0 * U, dt2 = dt * dt;
  for (const ch of charms) {
    const anchor = ribAt(ch.rib, ch.s), L = ch.len * U;
    if (!ch.p) { ch.p = []; ch.q = []; for (let k = 0; k < ch.n; k++) { ch.p.push([anchor[0], anchor[1] + k * L]); ch.q.push([anchor[0], anchor[1] + k * L]); } }
    const p = ch.p, q = ch.q;
    p[0][0] = anchor[0]; p[0][1] = anchor[1]; q[0][0] = anchor[0]; q[0][1] = anchor[1];
    for (let k = 1; k < ch.n; k++) {
      const vx = (p[k][0] - q[k][0]) * 0.985, vy = (p[k][1] - q[k][1]) * 0.985;
      q[k][0] = p[k][0]; q[k][1] = p[k][1];
      const nA = noise(ch.id * 3.1 + k * 0.22, T * 1.9) - 0.5, nB = noise(ch.id * 5.7 + k * 0.3 + 40, T * 1.6) - 0.5;
      const F = field(p[k][0], p[k][1], T), m = 6.5;
      const fx = F[0] * m + wn * 1.6 * nA * U, fy = g + F[1] * m + wn * 1.2 * nB * U;
      p[k][0] += vx + fx * dt2; p[k][1] += vy + fy * dt2;
    }
    for (let it = 0; it < 6; it++) for (let k = 1; k < ch.n; k++) {
      const a = p[k - 1], b = p[k], dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1e-6, diff = (d - L) / d;
      if (k === 1) { b[0] -= dx * diff; b[1] -= dy * diff; }
      else { a[0] += dx * diff * 0.5; a[1] += dy * diff * 0.5; b[0] -= dx * diff * 0.5; b[1] -= dy * diff * 0.5; }
    }
    const e = p[ch.n - 1], eq = q[ch.n - 1], spd = Math.hypot(e[0] - eq[0], e[1] - eq[1]) / dt;
    ch.spark = Math.max(0, ch.spark - dt * 2.5);
    if (spd > 1.05 * U && T - ch.lastSpark > 0.45 && M.S.v > 0.6) { ch.lastSpark = T; ch.spark = 1; }
  }
}

/* ---------------- 图元 ---------------- */
function shapePath(ctx, sh, x, y, s, r) {
  switch (sh) {
    case 'spark': { ctx.moveTo(x + Math.cos(r) * s, y + Math.sin(r) * s);
      for (let i = 1; i < 8; i++) { const a = r + i * Math.PI / 4, rr = i % 2 ? s * 0.3 : s; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
      ctx.closePath(); return 'fill'; }
    case 'star': { ctx.moveTo(x + Math.cos(r) * s, y + Math.sin(r) * s);
      for (let i = 1; i < 10; i++) { const a = r + i * Math.PI / 5, rr = i % 2 ? s * 0.45 : s; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
      ctx.closePath(); return 'fill'; }
    case 'plus': case 'x': { const a = r * 0.15 + (sh === 'x' ? Math.PI / 4 : 0);
      for (let i = 0; i < 2; i++) { const aa = a + i * Math.PI / 2, dx = Math.cos(aa) * s, dy = Math.sin(aa) * s; ctx.moveTo(x - dx, y - dy); ctx.lineTo(x + dx, y + dy); }
      return 'stroke'; }
    case 'ring': ctx.moveTo(x + s, y); ctx.arc(x, y, s, 0, TAU); return 'stroke';
    default: ctx.moveTo(x + s * 0.38, y); ctx.arc(x, y, s * 0.38, 0, TAU); return 'fill';

}
function drawShape(ctx, sh, x, y, s, r, a) { ctx.globalAlpha = a; ctx.beginPath(); if (shapePath(ctx, sh, x, y, s, r) === 'fill') ctx.fill(); else ctx.stroke(); }

function flare(ctx, x, y, L, a) {

  ctx.globalAlpha = a; ctx.drawImage(flareS, x - L / 2, y - L / 32, L, L / 16);
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 2);
  ctx.globalAlpha = a * 0.55; ctx.drawImage(flareS, -L * 0.18, -L / 64, L * 0.36, L / 32);

}
function drawPendant(ctx, ch) {
  const p = ch.p, n = ch.n, e = p[n - 1], b = p[n - 2];
  const ang = Math.atan2(e[1] - b[1], e[0] - b[0]) - Math.PI / 2, r = 0.012 * U, lw = Math.max(0.8, 1.3 * PX);
  ctx.save(); ctx.translate(e[0], e[1]); ctx.rotate(ang); ctx.globalAlpha = 0.9; ctx.beginPath();
  switch (ch.shape) {
    case 'moon': ctx.lineWidth = r * 0.36; ctx.arc(0, r * 1.05, r * 0.8, -0.35 * Math.PI, 0.95 * Math.PI); ctx.stroke(); break;
    case 'bell': ctx.lineWidth = lw;
      ctx.moveTo(-0.15 * r, 0); ctx.quadraticCurveTo(-0.75 * r, 0.15 * r, -0.8 * r, 1.1 * r); ctx.lineTo(0.8 * r, 1.1 * r);
      ctx.quadraticCurveTo(0.75 * r, 0.15 * r, 0.15 * r, 0); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 1.35 * r, 0.2 * r, 0, TAU); ctx.fill(); break;
    case 'star': shapePath(ctx, 'star', 0, r, r, -Math.PI / 2 + T * 0.8); ctx.fill(); break;
    case 'drop': ctx.lineWidth = lw;
      ctx.moveTo(0, 0); ctx.bezierCurveTo(0.75 * r, 0.9 * r, 0.65 * r, 1.8 * r, 0, 1.8 * r); ctx.bezierCurveTo(-0.65 * r, 1.8 * r, -0.75 * r, 0.9 * r, 0, 0); ctx.stroke(); break;
    case 'fish': ctx.lineWidth = lw;
      ctx.ellipse(0, 0.85 * r, 0.42 * r, 0.8 * r, 0, 0, TAU); ctx.moveTo(0, 1.6 * r);
      ctx.lineTo(-0.5 * r, 2.15 * r + Math.sin(T * 9) * 0.15 * r); ctx.lineTo(0.5 * r, 2.15 * r - Math.sin(T * 9) * 0.15 * r); ctx.closePath(); ctx.stroke(); break;
  }
  ctx.restore();
  glow(ctx, e[0], e[1], r * (2.2 + 3 * ch.spark), 0.3 + 0.5 * ch.spark);
  if (ch.spark > 0.02) flare(ctx, e[0], e[1], 0.12 * U, ch.spark * 0.7);
}

/* ---------------- 主循环 ---------------- */
function draw() {
  if (started && player && !player.paused && player.currentTime > 0) {
    const target = player.currentTime; let n = 0;          // 画面跟着声音走，字幕与音乐对齐
    while (T < target && n < 6) { update(1 / 60); n++; }
  } else if (started) { const dt = Math.min(1 / 30, deltaTime / 1000 || 1 / 60); update(dt / 2); update(dt / 2); }
  else if (!M) update(1 / 60);
  speak();
  render();
  if (!started) drawTitle();
  if (started && T > DUR - 0.05) { restart(); playFromStart(); }
}
function speak() {
  if (!narrOn || !window.speechSynthesis || !started) return;
  for (let i = 0; i < LINES.length; i++) {
    const [s] = LINES[i];
    if (T >= s && T < s + 0.5 && !spoken.has(i)) {
      spoken.add(i);
      const u = new SpeechSynthesisUtterance(LINES[i][2].replace(/\n/g, ''));
      u.lang = 'zh-CN'; u.rate = 0.78; u.volume = 0.95;
      const v = speechSynthesis.getVoices().find(v => /zh/i.test(v.lang)); if (v) u.voice = v;
      speechSynthesis.speak(u);
    }
  }
}

function render() {
  const ctx = drawingContext, S = M.S;
  ctx.save();
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(bgG.elt, 0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const kp = kickPulse(T);

  for (const d of dust) { ctx.globalAlpha = (0.25 + 0.5 * (0.5 + 0.5 * Math.sin(T * d.sp + d.ph))) * 0.55; ctx.fillRect(d.x, d.y, d.s, d.s); }
  ctx.lineWidth = Math.max(0.6, 1.0 * PX);
  const airIn = sstep(0.5, 4, T);
  for (const s of air) {
    const tw = 0.45 + 0.55 * Math.pow(0.5 + 0.5 * Math.sin(T * s.tw + s.ph), 2);
    drawShape(ctx, s.shape, s.x, s.y, s.sz, s.rot, s.a * tw * airIn);
  }

  const fadeIn = sstep(0, 0.35, T);
  const thin = Math.max(0.6, 0.9 * PX), glyphW = Math.max(0.7, 1.25 * PX);

  // 落下的星（细、少）
  ctx.lineWidth = thin;
  for (const p of rain) {
    const tx = p.x - p.vx * p.trail, ty = p.y - p.vy * p.trail;
    const g = ctx.createLinearGradient(tx, ty, p.x, p.y);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, `rgba(235,242,255,${0.5 * p.a})`);
    ctx.strokeStyle = g; ctx.globalAlpha = 1; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(p.x, p.y); ctx.stroke();
  }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = glyphW;
  for (const p of rain) drawShape(ctx, p.shape, p.x, p.y, p.sz, p.rot, 0.8 * p.a);

  // 被风吹走的星：尾巴指回伞面
  ctx.lineWidth = thin;
  for (const f of fly) {
    const h = f.hist; if (h.length < 2) continue;
    const fade = Math.min(1, f.age * 4);
    for (let k = 1; k < h.length; k++) {
      ctx.globalAlpha = (k / h.length) * 0.55 * f.a * fade;
      ctx.beginPath(); ctx.moveTo(h[k - 1][0], h[k - 1][1]); ctx.lineTo(k === h.length - 1 ? f.x : h[k][0], k === h.length - 1 ? f.y : h[k][1]); ctx.stroke();
    }
  }
  ctx.lineWidth = glyphW;
  for (const f of fly) drawShape(ctx, f.shape, f.x, f.y, f.sz, f.rot, 0.9 * f.a);

  // 伞：细线 + 很淡的辉光
  const strokeSegs = (am, width) => {
    ctx.lineWidth = width;
    for (const s of M.segs) { if (s.w <= 0.01) continue; ctx.globalAlpha = s.w * am * fadeIn; ctx.beginPath(); ctx.moveTo(s.a[0], s.a[1]); ctx.lineTo(s.b[0], s.b[1]); ctx.stroke(); }
    ctx.globalAlpha = am * fadeIn; ctx.beginPath();
    for (const [a, b] of M.shaft) { ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
    ctx.stroke();
  };
  const lw = Math.max(0.75, 1.15 * PX);

  ctx.strokeStyle = '#fff'; strokeSegs(0.9, lw);

  glow(ctx, hk[0], hk[1], 0.022 * U, 0.3 * fadeIn);

  // 挂件
  ctx.lineWidth = thin;
  for (const ch of charms) {
    if (!ch.p) continue;
    ctx.globalAlpha = 0.55 * fadeIn; ctx.beginPath(); ctx.moveTo(ch.p[0][0], ch.p[0][1]);
    for (let k = 1; k < ch.n; k++) ctx.lineTo(ch.p[k][0], ch.p[k][1]);
    ctx.stroke(); drawPendant(ctx, ch);
  }

  // 停在伞线上的星
  ctx.lineWidth = glyphW;
  let nearHub = 0;
  for (const c of sit) {
    const [x, y] = sitPos(c), age = T - c.born, pop = 1 + 0.8 * Math.exp(-age * 9);
    drawShape(ctx, c.shape, x, y, c.sz * pop, c.rot, c.a * Math.min(1, age * 6) * (0.7 + 0.3 * Math.sin(T * 3 + c.ph)));
    if (c.rib !== undefined && c.s < 1.4) nearHub++;
  }
  ctx.lineWidth = thin;
  for (const b of bursts) {
    const k = b.t / 0.45; ctx.globalAlpha = (1 - k) * 0.6;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.s * (1 + k * 3), 0, TAU); ctx.stroke();

  }

  const fill = Math.min(1, sit.length / 450);
  const hubA = (0.25 + 0.8 * fill + 0.2 * Math.min(1, nearHub / 60) + 0.35 * kp) * S.v * (0.88 + 0.12 * Math.sin(T * 2.3));
  flare(ctx, M.hub[0], M.hub[1], (0.30 + 0.06 * kp) * U, hubA * 0.9);
  for (let i = 0; i < NR; i++) {
    const n1 = noise(i * 13.7, T * 0.9);
    const a = Math.pow(clamp((n1 - 0.45) * 2.2, 0, 1), 2.2) * (0.3 + fill) * S.v;
    const p = ribAt(i, [K, 3, K, 5, K, 2, K, 4, K, 6][i]);

  }

  ctx.globalCompositeOperation = 'source-over';
  if (capOn) drawCaptions(ctx);

  if (dark > 0.001) { ctx.globalAlpha = dark; ctx.fillStyle = 'rgb(8,12,90)'; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}
function drawCaptions(ctx) {
  const fs = 0.022 * U;
  ctx.font = `300 ${fs}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  try { ctx.letterSpacing = `${(fs * 0.16).toFixed(1)}px`; } catch (e) {}
  for (const [s, e, txt] of LINES) {
    if (T < s || T > e) continue;
    const a = sstep(s, s + 1.4, T) * (1 - sstep(e - 1.3, e, T)), rows = txt.split('\n');
    const y0 = H * 0.875 - (rows.length - 1) * fs * 0.95 + (1 - a) * fs * 0.4;
    ctx.shadowColor = 'rgba(150,190,255,0.9)'; ctx.shadowBlur = fs * 0.6 * a; ctx.fillStyle = '#fff'; ctx.globalAlpha = a * 0.9;
    rows.forEach((r, i) => ctx.fillText(r, W / 2, y0 + i * fs * 1.9));
    ctx.shadowBlur = 0;
  }
}
function drawTitle() {
  const ctx = drawingContext;
  ctx.save();
  ctx.globalAlpha = 0.7; ctx.fillStyle = 'rgb(8,12,90)'; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(150,190,255,0.9)'; ctx.shadowBlur = 0.02 * U;
  ctx.font = `500 ${0.042 * U}px ${FONT}`; try { ctx.letterSpacing = `${0.012 * U}px`; } catch (e) {}
  ctx.fillText('接住星星的伞', W / 2, H * 0.44);
  ctx.font = `300 ${0.019 * U}px ${FONT}`; ctx.globalAlpha = 0.6 + 0.3 * Math.sin(millis() / 600);
  ctx.fillText(audioState === 'rendering' ? '正在准备声音…' : '轻触，入梦 · 请打开声音', W / 2, H * 0.52);
  ctx.restore();
}

/* ==========================================================================
   原创配乐 · 100 BPM 的轻电子
   0–3.2 秒：闪烁上扬的前奏（伞在翻滚、撑开）
   3.2 秒落拍：伞被风掀翻，冲击声 + 和弦进入

const MELODY = [
  [[0, 1.5, 69], [1.5, 0.5, 67], [2, 1, 65], [3, 1, 64]],
  [[0, 2, 62], [2, 1, 65], [3, 1, 69]],
  [[0, 1.5, 70], [1.5, 0.5, 69], [2, 1, 67], [3, 1, 65]],
  [[0, 2.5, 64], [2.5, 1.5, 61]],
];
const MELODY2 = [                                   // 第二轮的变奏：落在更低处
  [[0, 1, 72], [1, 1, 70], [2, 1.5, 69], [3.5, 0.5, 67]],
  [[0, 3, 65], [3, 1, 62]],
  [[0, 1, 67], [1, 1, 65], [2, 1.5, 64], [3.5, 0.5, 62]],

class Score {

  impulse(sec, decay) {
    const c = this.ctx, n = Math.floor(c.sampleRate * sec), b = c.createBuffer(2, n, c.sampleRate), r = mulberry(99);
    for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < n; i++) d[i] = (r() * 2 - 1) * Math.pow(1 - i / n, decay); }
    return b;
  }
  makeNoise() { const c = this.ctx, b = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = b.getChannelData(0), r = mulberry(5); for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; return b; }
  out(node, dry, wet, dly, pan) {
    const c = this.ctx; let n = node;
    if (pan !== undefined && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = pan; node.connect(p); n = p; }
    if (dry) { const g = c.createGain(); g.gain.value = dry; n.connect(g); g.connect(this.dry); }
    if (wet) { const g = c.createGain(); g.gain.value = wet; n.connect(g); g.connect(this.wet); }
    if (dly) { const g = c.createGain(); g.gain.value = dly; n.connect(g); g.connect(this.dIn); }
  }
  now() { return this.ctx.currentTime - this.t0; }
  mute(m) { this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.1); }
  dispose() { const c = this.ctx; try { this.master.gain.setTargetAtTime(0, c.currentTime, 0.3); setTimeout(() => c.close && c.close(), 1500); } catch (e) {} }

  start(t0) {
    this.t0 = t0;
    this.intro(t0);
    for (let b = 0; b < 20; b++) {
      const s = t0 + DROP + b * BAR, sec = section(b), ch = CHORDS[b % 4];
      if (sec === 'end') {
        this.pad(s, BAR * 0.6, [38, 50, 57, 60, 64, 65, 69], 1.0, 5.5);
        this.cello(s, 38, BAR * 0.8, 0.9);
        [81, 77, 76, 74, 69, 62].forEach((m, i) => this.box(s + i * BEAT * 0.75, m, 0.75 - i * 0.07));   // 一串往下落的音
        break;
      }
      const lvl = sec === 'a' ? 0.7 : sec === 'd' ? 0.8 : 1;
      this.pad(s, BAR, ch.v, lvl, 1.4);
      // 八音盒：八分音符，越往后越稀
      const pool = ch.v.slice(1).map(m => m + 12);
      for (let i = 0; i < 8; i++) {
        const keep = i % 2 === 0 || this.rng() < (sec === 'c' ? 0.5 : 0.3);
        if (!keep || (sec === 'd' && this.rng() < 0.4)) continue;
        const idx = (i * 3 + b) % pool.length;
        this.box(s + i * BEAT / 2, pool[idx], (i % 4 === 0 ? 0.7 : 0.45) * (sec === 'a' ? 0.85 : 1));
      }
      // 主旋律
      if (sec === 'b' || sec === 'c') {
        const mel = (b >= 9 && b < 14 && (b - 9) % 8 >= 4) || b >= 17 ? MELODY2 : MELODY;
        const oct = sec === 'c' ? 12 : 0;
        for (const [at, len, m] of mel[b % 4]) this.lead(s + at * BEAT, len * BEAT, m + oct, sec === 'c' ? 0.9 : 0.75);
      }
      if (sec === 'c') this.cello(s, ch.root, BAR, 0.8);
      else this.bass(s, ch.root, BAR * 0.98, sec === 'd' ? 0.45 : 0.6);
      for (const k of kickBeats(sec)) this.kick(s + k * BEAT, k === 0 ? 0.8 : 0.5);
      if (sec === 'c' && this.rng() < 0.6) this.glint(s + (2 + Math.floor(this.rng() * 4)) * BEAT / 2, 0.4);
      if (b === 16) this.riser(s, BAR);
    }
    this.master.gain.setValueAtTime(0.9, t0 + DUR - 3.0);
    this.master.gain.linearRampToValueAtTime(0, t0 + DUR - 0.2);
  }
  intro(t0) {
    const c = this.ctx;
    // 低处的嗡鸣慢慢升起
    for (const [m, d] of [[38, -4], [45, 5]]) {
      const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = d;
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 260;
      const g = c.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.035, t0 + DROP); g.gain.linearRampToValueAtTime(0, t0 + DROP + 2.5);
      o.connect(f); f.connect(g); this.out(g, 0.6, 0.8); o.start(t0); o.stop(t0 + DROP + 2.6);
    }
    // 由暗到亮的气息
    const src = c.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(350, t0); bp.frequency.exponentialRampToValueAtTime(2400, t0 + DROP);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.05, t0 + DROP - 0.05); g.gain.linearRampToValueAtTime(0, t0 + DROP + 0.1);
    src.connect(bp); bp.connect(g); this.out(g, 0.5, 0.8); src.start(t0); src.stop(t0 + DROP + 0.2);
    for (let i = 0; i < 18; i++) this.glint(t0 + DROP * Math.pow(i / 18, 0.7), 0.15 + 0.3 * (i / 18));
    // 伞撑开那一下：一个小三和弦，轻轻拨开
    [62, 65, 69, 74].forEach((m, i) => this.box(t0 + 0.95 + i * 0.07, m, 0.6));
    this.impact(t0 + DROP, 0.7);
  }
  box(s, m, vel) {                                        // 八音盒 / 钢片琴
    const c = this.ctx, f = mtof(m), g = c.createGain();
    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(0.05 * vel, s + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, s + 2.6);
    for (const [mul, amp, dec] of [[1, 1, 2.6], [2, 0.22, 1.0], [3.01, 0.06, 0.5]]) {
      const o = c.createOscillator(); o.frequency.value = f * mul; const og = c.createGain();
      og.gain.setValueAtTime(amp, s); og.gain.exponentialRampToValueAtTime(0.0001, s + dec);
      o.connect(og); og.connect(g); o.start(s); o.stop(s + dec + 0.05);
    }
    this.out(g, 0.45, 0.8, 0.4, (this.rng() - 0.5) * 0.7);
  }
  lead(s, dur, m, vel) {                                  // 主旋律：带一点颤音的柔和长音，像远处有人哼着
    const c = this.ctx, f = mtof(m), g = c.createGain();
    const pk = 0.055 * vel, end = s + dur + 0.6;
    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(pk, s + 0.12); g.gain.setValueAtTime(pk * 0.85, s + dur * 0.8); g.gain.linearRampToValueAtTime(0, end);
    const vib = c.createOscillator(); vib.frequency.value = 4.6; const vg = c.createGain();
    vg.gain.setValueAtTime(0, s); vg.gain.linearRampToValueAtTime(f * 0.006, s + Math.min(dur, 0.8));
    vib.connect(vg);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    for (const [type, mul, amp] of [['sine', 1, 1], ['triangle', 1, 0.35], ['sine', 2, 0.12]]) {
      const o = c.createOscillator(); o.type = type; o.frequency.value = f * mul; vg.connect(o.frequency);
      const og = c.createGain(); og.gain.value = amp; o.connect(og); og.connect(lp); o.start(s); o.stop(end + 0.05);
    }
    vib.start(s); vib.stop(end + 0.05);
    lp.connect(g); this.out(g, 0.55, 0.9, 0.25, 0.1);
  }
  cello(s, m, dur, vel) {                                 // 低音弦：缓慢起落的长音
    const c = this.ctx, g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 520; f.Q.value = 0.8;
    const pk = 0.05 * vel;
    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(pk, s + 0.7); g.gain.linearRampToValueAtTime(pk * 0.7, s + dur); g.gain.linearRampToValueAtTime(0, s + dur + 1.2);
    for (const [mul, d] of [[1, -6], [1, 7], [2, 0]]) {
      const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m + 12) * mul; o.detune.value = d;
      o.connect(f); o.start(s); o.stop(s + dur + 1.3);
    }
    f.connect(g); this.out(g, 0.6, 0.8);
  }
  pad(s, dur, notes, lvl, rel) {
    const c = this.ctx, f = c.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 0.7;
    f.frequency.setValueAtTime(480, s); f.frequency.linearRampToValueAtTime(900, s + dur * 0.6); f.frequency.linearRampToValueAtTime(520, s + dur + rel);
    const g = c.createGain(), pk = 0.016 * lvl;
    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(pk, s + 0.9); g.gain.setValueAtTime(pk * 0.9, s + dur); g.gain.linearRampToValueAtTime(0, s + dur + rel);
    for (const m of notes) for (const d of [-8, 7]) {
      const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = d; o.connect(f); o.start(s); o.stop(s + dur + rel + 0.05);
    }
    f.connect(g); this.out(g, 0.55, 0.8);
  }
  pluck(s, m, vel, open, pan) {
    const c = this.ctx, f = c.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 2;
    f.frequency.setValueAtTime(open * 1.6, s); f.frequency.exponentialRampToValueAtTime(380, s + 0.35);
    const g = c.createGain();
    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(0.085 * vel, s + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.9);
    const o = c.createOscillator(); o.type = 'square'; o.frequency.value = mtof(m);
    const o2 = c.createOscillator(); o2.type = 'triangle'; o2.frequency.value = mtof(m + 12); o2.detune.value = 4;
    const g2 = c.createGain(); g2.gain.value = 0.5;
    o.connect(f); o2.connect(g2); g2.connect(f); f.connect(g);
    o.start(s); o2.start(s); o.stop(s + 0.95); o2.stop(s + 0.95);
    this.out(g, 0.55, 0.45, 0.35, pan);
  }
  glint(s, vel = 0.6) {                                   // 高处的闪光音（像星星眨眼）
    const c = this.ctx, NOTES = [88, 91, 93, 95, 98, 100, 103];
    const f = mtof(NOTES[Math.floor(this.rng() * NOTES.length)]), g = c.createGain();
    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(0.012 * vel, s + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, s + 1.2);
    for (const [mul, amp] of [[1, 1], [2.76, 0.25]]) { const o = c.createOscillator(); o.frequency.value = f * mul; const og = c.createGain(); og.gain.value = amp; o.connect(og); og.connect(g); o.start(s); o.stop(s + 1.25); }
    this.out(g, 0.3, 0.9, 0.4, (this.rng() * 2 - 1) * 0.8);
  }
  kick(s, vel = 1) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(95, s); o.frequency.exponentialRampToValueAtTime(40, s + 0.15);
    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(0.22 * vel, s + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.6);
    o.connect(g); g.connect(this.drums); o.start(s); o.stop(s + 0.5);
  }
  duck(s) {                                               // 让和声随底鼓起伏
    const gg = this.bus.gain;
    for (let k = 0; k < 4; k += 2) { const t = s + k * BEAT; gg.setValueAtTime(1, t); gg.linearRampToValueAtTime(0.55, t + 0.02); gg.linearRampToValueAtTime(1, t + BEAT * 0.9); }
  }
  bass(s, m, dur, vel) {
    const c = this.ctx, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth'; o.frequency.value = mtof(m);
    const sub = c.createOscillator(); sub.frequency.value = mtof(m - 12); const sg = c.createGain(); sg.gain.value = 0.9;
    f.type = 'lowpass'; f.frequency.setValueAtTime(420, s); f.frequency.exponentialRampToValueAtTime(160, s + dur); f.Q.value = 1.5;
    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(0.055 * vel, s + 0.01); g.gain.setValueAtTime(0.05 * vel, s + dur * 0.8); g.gain.linearRampToValueAtTime(0, s + dur);
    o.connect(f); sub.connect(sg); sg.connect(f); f.connect(g); g.connect(this.drums);
    o.start(s); sub.start(s); o.stop(s + dur + 0.05); sub.stop(s + dur + 0.05);
  }
  hat(s, vel) {
    const c = this.ctx, src = c.createBufferSource(); src.buffer = this.noise;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7500;
    const g = c.createGain(); g.gain.setValueAtTime(0.03 * vel, s); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.06);
    src.connect(hp); hp.connect(g); this.out(g, 0.6, 0.15, 0, 0.3); src.start(s, this.rng()); src.stop(s + 0.08);
  }
  clap(s) {
    const c = this.ctx, src = c.createBufferSource(); src.buffer = this.noise;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1600; bp.Q.value = 0.9;
    const g = c.createGain(); g.gain.setValueAtTime(0, s);
    for (const d of [0, 0.012, 0.024]) { g.gain.setValueAtTime(0.09, s + d); g.gain.exponentialRampToValueAtTime(0.01, s + d + 0.011); }
    g.gain.setValueAtTime(0.06, s + 0.036); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.25);
    src.connect(bp); bp.connect(g); this.out(g, 0.5, 0.6); src.start(s, this.rng()); src.stop(s + 0.3);
  }
  impact(s, vel) {                                        // 落拍的冲击：低沉一击 + 散开的亮噪声
    const c = this.ctx;
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(90, s); o.frequency.exponentialRampToValueAtTime(30, s + 1.2);
    g.gain.setValueAtTime(0.3 * vel, s); g.gain.exponentialRampToValueAtTime(0.0001, s + 1.6);
    o.connect(g); g.connect(this.drums); o.start(s); o.stop(s + 1.7);
    const src = c.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000;
    const ng = c.createGain(); ng.gain.setValueAtTime(0.06 * vel, s); ng.gain.exponentialRampToValueAtTime(0.0001, s + 2.2);
    src.connect(hp); hp.connect(ng); this.out(ng, 0.4, 0.9); src.start(s); src.stop(s + 2.3);
  }
  riser(s, dur) {
    const c = this.ctx, src = c.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.5;
    bp.frequency.setValueAtTime(400, s); bp.frequency.exponentialRampToValueAtTime(5000, s + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.06, s + dur - 0.05); g.gain.linearRampToValueAtTime(0, s + dur);
    src.connect(bp); bp.connect(g); this.out(g, 0.6, 0.6); src.start(s); src.stop(s + dur + 0.1);
  }
  bellRun(s) { [76, 79, 83, 86, 88, 91].forEach((m, i) => this.pluck(s + i * BEAT / 2, m, 0.8 - i * 0.06, 3000, (i % 2 ? 0.4 : -0.4))); }
}

/* ---------------- 离线工具 ---------------- */
window.__seek = (sec) => { restart(); started = true; while (T < sec) update(1 / 60); render(); };
window.__beginRender = () => { restart(); started = true; };
window.__frame = (fps) => { const n = Math.round(60 / fps); for (let i = 0; i < n; i++) update(1 / 60); render(); return T; };
window.__renderAudio = async () => {
  const sr = 44100, ctx = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr);
  const d = new Score(ctx, ctx.destination); d.start(0);
  const buf = await ctx.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length, out = new Int16Array(n * 2);
  for (let i = 0; i < n; i++) { out[2 * i] = clamp(L[i], -1, 1) * 32767; out[2 * i + 1] = clamp(R[i], -1, 1) * 32767; }
  let s = ''; const u8 = new Uint8Array(out.buffer);
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return { sr, b64: btoa(s) };
};
